[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The only place the version is written. Every release bumps it, and a test in
# crates/cli/tests/version.rs checks it against the newest CHANGELOG.md entry.
version = "0.1.45"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# unwrap and expect are allowed in tests (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
disallowed_methods = "deny"

[workspace.dependencies]
model = { package = "cp-model", path = "crates/model" }
engine = { package = "cp-engine", path = "crates/engine" }
clap = { version = "4.6", features = ["derive"] }
indexmap = { version = "2.14", features = ["serde"] }
schemars = { version = "1.2", features = ["url2"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
tempfile = "3.27"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
httpdate = "1"
wiremock = "0.6"
secrecy = "0.10"
url = { version = "2.5", features = ["serde"] }
log = "0.4"
