name: Weekly content health
on:
  schedule:
    - cron: '40 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: content-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Check links
        id: links
        continue-on-error: true
        run: cargo run --quiet --locked -p cli -- check-links > link-report.json
      - name: Verify external identifiers
        id: identifiers
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.COLLECTION_GITHUB_TOKEN }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
        run: cargo run --quiet --locked -p cli -- verify-ids > id-report.json
      - name: Update the single health issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/checks/weekly.py link-report.json id-report.json
