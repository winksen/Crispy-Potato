[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The only place the version is written. Every release bumps it, and a test in
# crates/cli/tests/version.rs checks it against the newest CHANGELOG.md entry.
version = "0.1.9"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# unwrap and expect are allowed in tests (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
model = { path = "crates/model" }
engine = { path = "crates/engine" }
clap = { version = "4.6", features = ["derive"] }
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
tempfile = "3.27"
url = { version = "2.5", features = ["serde"] }
