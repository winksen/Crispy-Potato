# Every push to main and every pull request (release index, V0.1.4 and V0.1.5).
#
# Pull requests that edit content come from contributors and are untrusted, so
# this workflow only ever runs on `pull_request` (never `pull_request_target`),
# with a read-only token that is not kept in the checkout. Third-party actions
# are pinned by commit SHA; the comment names the release the SHA belongs to.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    permissions:
      contents: read
    if: github.event_name != 'schedule'
    name: Format, lints, content and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: cp_owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: crispy_potato
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cp_owner -d crispy_potato"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://cp_owner:ci-only@localhost:5432/crispy_potato
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # rustup comes with the runner image, so no action is needed for it; it
      # also reads rust-toolchain.toml.
      - name: Install the Rust toolchain
        shell: python
        run: |
          import pathlib, subprocess, tomllib
          channel = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          subprocess.run(['rustup', 'toolchain', 'install', channel, '--profile', 'minimal', '--component', 'rustfmt,clippy'], check=True)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Cache SQLx tooling
        id: sqlx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.9.0-${{ runner.os }}-${{ runner.arch }}-rustls-postgres

      - name: Install SQLx tooling
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres

      - name: Check SQL metadata
        run: |
          cargo sqlx migrate run --source crates/engine/migrations
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db/roles.sql
          cargo sqlx prepare --check --workspace -- --all-targets
        env:
          SQLX_OFFLINE: 'false'

      - name: Lints
        if: success() || failure()
        run: cargo clippy --all-targets --locked -- -D warnings

      # Before the tests, so a pull request with a broken content file fails here
      # with the validator's report.
      - name: Validate content
        if: success() || failure()
        run: cargo validate

      # The committed JSON Schemas must match the model types and vocabularies.
      - name: Schemas are up to date
        if: success() || failure()
        run: cargo schema --check

      - name: Report workflow tests
        run: python -m unittest discover -s scripts/checks -p 'test_*.py'

      - name: Reject dynamic application SQL
        run: python scripts/checks/sql_guard.py

      - name: Tests
        run: cargo test --locked

  # Advisories, licenses, banned crates and sources, as set in deny.toml.
  deny:
    permissions:
      contents: read
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  workflows:
    name: Workflow security
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned workflow linter
        run: pipx install zizmor==1.31.1
      - name: Audit every workflow
        run: zizmor --offline --strict-collection --persona auditor .github/workflows

  advisory-report:
    name: Maintain the daily dependency issue
    needs: deny
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # Maintain the single dependency health issue.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHECK_RESULT: ${{ needs.deny.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # No checkout or project/dependency execution with the write token.
      - name: Open, update or close the dependency issue
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          marker = '<!-- crispy-potato-dependency-health -->'
          title = 'Dependency health checks'
          issues = json.loads(subprocess.check_output([
              'gh', 'issue', 'list', '--state', 'all', '--limit', '100',
              '--search', f'"{title}" in:title', '--json', 'number,title,body,state,author'
          ], text=True))
          issue = next((i for i in issues if i['title'] == title
              and marker in (i.get('body') or '')
              and i.get('author', {}).get('is_bot') is True), None)
          failed = os.environ['CHECK_RESULT'] != 'success'
          if issue is None and not failed:
              raise SystemExit(0)
          body = marker + '\nDaily cargo deny result: ' + os.environ['CHECK_RESULT']
          body += '\n\n[Workflow details](' + os.environ['RUN_URL'] + ')\n'
          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / 'body.md'
              path.write_text(body, encoding='utf-8')
              if issue is None:
                  subprocess.run(['gh', 'issue', 'create', '--title', title, '--body-file', str(path)], check=True)
              else:
                  number = str(issue['number'])
                  subprocess.run(['gh', 'issue', 'edit', number, '--body-file', str(path)], check=True)
                  if failed and issue['state'] == 'CLOSED':
                      subprocess.run(['gh', 'issue', 'reopen', number], check=True)
                  elif not failed and issue['state'] == 'OPEN':
                      subprocess.run(['gh', 'issue', 'close', number], check=True)
