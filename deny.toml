# cargo-deny policy (release index, V0.1.5). Run `cargo deny check`; CI runs it
# on every push to main and every pull request.

[graph]
all-features = true

[advisories]
# Vulnerabilities, unsound code and notices from the RustSec database fail the
# check. Unmaintained crates fail it when the workspace depends on them
# directly; the ones deep in third-party trees are not ours to replace.
unmaintained = "workspace"
yanked = "warn"
# An ignored advisory needs a reason and a date to revisit it.
ignore = []

[licenses]
# Decision D1: the code is MIT OR Apache-2.0, so every dependency must be under
# a permissive license that allows it. Copyleft licenses (GPL, LGPL, AGPL, MPL,
# EUPL, CC BY-SA) are not on the list. Add a license only after reading it, and
# name it in the changelog.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  # webpki-roots trust data; reviewed https://cdla.dev/permissive-2-0/.
  # Redistribution requires retaining the agreement; no copyleft condition.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# The list names licenses the planned dependencies use, before they arrive.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates are checked too.
ignore = false

[bans]
# Two versions of one crate cost build time but are not a defect.
multiple-versions = "warn"
# No `*` version requirements; the workspace's own path dependencies are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io is the only source: no other registry, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
